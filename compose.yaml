name: new-api

services:
  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:latest}
    restart: unless-stopped
    command: --log-dir /app/logs
    expose:
      - "3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      STREAMING_TIMEOUT: ${STREAMING_TIMEOUT:-300}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      GLOBAL_API_RATE_LIMIT_ENABLE: ${GLOBAL_API_RATE_LIMIT_ENABLE:-true}
      GLOBAL_API_RATE_LIMIT: ${GLOBAL_API_RATE_LIMIT:-180}
      GLOBAL_API_RATE_LIMIT_DURATION: ${GLOBAL_API_RATE_LIMIT_DURATION:-180}
      GLOBAL_WEB_RATE_LIMIT_ENABLE: ${GLOBAL_WEB_RATE_LIMIT_ENABLE:-true}
      GLOBAL_WEB_RATE_LIMIT: ${GLOBAL_WEB_RATE_LIMIT:-60}
      GLOBAL_WEB_RATE_LIMIT_DURATION: ${GLOBAL_WEB_RATE_LIMIT_DURATION:-180}
      CRITICAL_RATE_LIMIT_ENABLE: ${CRITICAL_RATE_LIMIT_ENABLE:-true}
      CRITICAL_RATE_LIMIT: ${CRITICAL_RATE_LIMIT:-20}
      CRITICAL_RATE_LIMIT_DURATION: ${CRITICAL_RATE_LIMIT_DURATION:-1200}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":\\s*true'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      new-api:
        condition: service_healthy
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
  backend:
    internal: true
