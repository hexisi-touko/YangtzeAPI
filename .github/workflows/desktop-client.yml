name: Desktop Client

on:
  push:
    paths:
      - 'desktop-client/**'
      - '.github/workflows/desktop-client.yml'
  pull_request:
    paths:
      - 'desktop-client/**'
      - '.github/workflows/desktop-client.yml'

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
