<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http: https:; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kimi 智能助手</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- 纯白无边框窗口顶栏 -->
  <header class="chat-topbar">
    <div class="topbar-drag-region">
      <div class="chat-brand">
        <div class="kimi-avatar-logo">
          <svg viewBox="0 0 24 25" fill="currentColor">
            <path d="M21.7202 0.939941C22.9502 0.939941 23.9502 1.93994 23.9502 3.16994C23.9502 4.39994 22.9502 5.39994 21.7202 5.39994H19.7502C19.6002 5.39994 19.4902 5.27994 19.4902 5.13994V3.16994C19.4902 1.93994 20.4902 0.939941 21.7202 0.939941Z" fill="#1783FF"></path>
            <path d="M9.39 13.9501L17.82 5.59012C17.98 5.43012 17.89 5.12012 17.68 5.12012H13.14C13.14 5.12012 13.04 5.14012 13 5.18012L3.92 14.1901C3.78 14.3301 3.57 14.2101 3.57 13.9801V5.39012C3.57 5.24012 3.47 5.12012 3.35 5.12012H0.219999C0.0999993 5.12012 0 5.24012 0 5.39012V23.9201C0 24.0701 0.0999993 24.1901 0.219999 24.1901H3.35C3.47 24.1901 3.57 24.0701 3.57 23.9201V20.1401C3.57 20.0601 3.6 19.9801 3.65 19.9301L6.47 17.1401C6.54 17.0701 6.63 17.0601 6.71 17.1101L14.24 22.6501C15.47 23.4801 16.85 23.9901 18.25 24.1401C18.37 24.1501 18.48 24.0301 18.48 23.8701V20.3101C18.48 20.1701 18.4 20.0601 18.29 20.0501C17.47 19.9201 16.66 19.6001 15.94 19.1101L9.42 14.3901C9.28 14.3001 9.27 14.0701 9.39 13.9501Z" fill="#1783FF"></path>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">Kimi 智能助手</span>
          <span class="brand-tag">Moonshot AI</span>
        </div>
      </div>
    </div>

    <div class="topbar-actions">
      <!-- 当前模型指示 -->
      <div class="model-badge-box">
        <span class="model-dot"></span>
        <span id="current-model-name" class="font-mono">moonshot-v1-8k</span>
      </div>

      <!-- 清空对话按钮 -->
      <button id="btn-clear-chat" class="topbar-btn" type="button" title="清空当前对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>

      <!-- 窗口控制按钮组 -->
      <div class="window-controls">
        <button id="chat-win-min" class="win-btn" type="button" title="最小化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="chat-win-max" class="win-btn" type="button" title="最大化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
        </button>
        <button id="chat-win-close" class="win-btn win-btn-close" type="button" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 消息滚动主体 -->
  <main class="chat-main" id="chat-stream">
    <!-- 欢迎引导卡片 -->
    <div class="welcome-container" id="welcome-box">
      <div class="welcome-logo-large">
        <svg viewBox="0 0 24 25" fill="currentColor">
          <path d="M21.7202 0.939941C22.9502 0.939941 23.9502 1.93994 23.9502 3.16994C23.9502 4.39994 22.9502 5.39994 21.7202 5.39994H19.7502C19.6002 5.39994 19.4902 5.27994 19.4902 5.13994V3.16994C19.4902 1.93994 20.4902 0.939941 21.7202 0.939941Z" fill="#1783FF"></path>
          <path d="M9.39 13.9501L17.82 5.59012C17.98 5.43012 17.89 5.12012 17.68 5.12012H13.14C13.14 5.12012 13.04 5.14012 13 5.18012L3.92 14.1901C3.78 14.3301 3.57 14.2101 3.57 13.9801V5.39012C3.57 5.24012 3.47 5.12012 3.35 5.12012H0.219999C0.0999993 5.12012 0 5.24012 0 5.39012V23.9201C0 24.0701 0.0999993 24.1901 0.219999 24.1901H3.35C3.47 24.1901 3.57 24.0701 3.57 23.9201V20.1401C3.57 20.0601 3.6 19.9801 3.65 19.9301L6.47 17.1401C6.54 17.0701 6.63 17.0601 6.71 17.1101L14.24 22.6501C15.47 23.4801 16.85 23.9901 18.25 24.1401C18.37 24.1501 18.48 24.0301 18.48 23.8701V20.3101C18.48 20.1701 18.4 20.0601 18.29 20.0501C17.47 19.9201 16.66 19.6001 15.94 19.1101L9.42 14.3901C9.28 14.3001 9.27 14.0701 9.39 13.9501Z" fill="#1783FF"></path>
        </svg>
      </div>
      <h2 class="welcome-title">你好！我是 Kimi 智能助手</h2>
      <p class="welcome-subtitle">已连接当前 YangtzeAPI 专属网关。支持超长上下文阅读、编程开发、中文深度思考与知识问答。</p>

      <div class="prompts-grid">
        <button class="prompt-quick-card" type="button" data-prompt="你好，请告诉我你是什么模型">
          <span class="prompt-icon">🤖</span>
          <span class="prompt-text">你好，请告诉我你是什么模型</span>
        </button>
        <button class="prompt-quick-card" type="button" data-prompt="帮我写一段 Python 快速测试 API 连通性的脚本">
          <span class="prompt-icon">🐍</span>
          <span class="prompt-text">写一段 Python 测试 API 连通性的脚本</span>
        </button>
        <button class="prompt-quick-card" type="button" data-prompt="介绍一下智慧油田项目中 AI 大模型有哪些典型应用场景？">
          <span class="prompt-icon">🛢️</span>
          <span class="prompt-text">智慧油田项目中 AI 的典型应用场景</span>
        </button>
      </div>
    </div>

    <!-- 消息对话流 -->
    <div class="messages-wrap" id="messages-list"></div>
  </main>

  <!-- 底部输入栏 -->
  <footer class="chat-footer">
    <div class="input-container">
      <textarea id="chat-input" class="chat-textarea" placeholder="给 Kimi 发送消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button id="btn-send" class="btn-send-message" type="button" title="发送消息">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="footer-caption">
      <span>已绑定账号专属 Key · 流量由本地 YangtzeAPI 网关统一鉴权调度</span>
    </div>
  </footer>

  <script src="chat.js"></script>
</body>
</html>
